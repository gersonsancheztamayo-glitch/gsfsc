.dtabs{display:flex;gap:6px;margin:8px 0}.dtabs button{border:1px solid var(--s-line);background:var(--s-panel);color:var(--s-ink);border-radius:6px;padding:5px 10px;font-size:13px}.dtabs button.on{background:var(--s-acc);color:#fff;border-color:var(--s-acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.kpi{border:1px solid var(--s-line);border-radius:8px;padding:8px}.kpi small{display:block;color:var(--s-muted);font-size:11.5px}.kpi b{font-size:20px}
.bars{display:grid;gap:5px;margin-top:8px}.bar{display:grid;grid-template-columns:150px 1fr 28px;gap:8px;align-items:center;font-size:12.5px}.bar i{display:block;height:10px;border-radius:5px;background:#e57373}.bar u{display:block;background:var(--s-line);border-radius:5px;text-decoration:none}

.bit{max-height:280px;overflow-y:auto;display:grid;gap:4px;margin-top:8px;padding-right:4px;scrollbar-width:thin}.bit div{font-size:12.8px;line-height:1.4;padding:4px 7px;border-radius:6px;border-left:3px solid var(--s-line)}

.bitf{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}.bitf button{border:1px solid var(--s-line);background:var(--s-panel);color:var(--s-ink);border-radius:99px;padding:3px 10px;font-size:12px}.bitf button.on{background:#1a73e8;color:#fff;border-color:#1a73e8}

.lvl{width:100%;accent-color:var(--s-acc)}.lvlt{display:flex;justify-content:space-between;font-size:11px;color:var(--s-muted);margin-top:2px}.lvln{font-size:12.5px;color:var(--s-muted);margin-top:6px;line-height:1.45}

.rep table{width:100%;border-collapse:collapse;font-size:13px}.rep td{border-bottom:1px solid #eee;padding:4px 2px}.rep .big{font-size:26px;font-weight:800;color:#1162a6}.sheet{max-height:86%;overflow:auto}
.ai{position:relative}.ai .bd{position:absolute;top:-4px;right:-4px;background:#e53935;color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center}

.sb{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 26px 8px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

/* Mi ruta */
.rhd{background:var(--hd);border-bottom:4px solid var(--bar);padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:flex-end}
.rhd b{font-size:20px} .rhd .nm{font-size:13px;margin-top:2px} .rhd .dt{font-size:14px}
.sec{padding:14px 16px 0;font-size:18px}
.ract{display:grid;grid-template-columns:26px 1fr;gap:14px;padding:10px 16px 6px;cursor:pointer}

.rsep{border-top:1px solid var(--line);margin:8px 0}

.flist{list-style:none;margin:14px 0 0;padding:0;max-height:380px;overflow:auto}

.flist li:not(:last-child)::after{content:"";position:absolute;left:10px;top:24px;bottom:4px;width:1.5px;background:#fff;opacity:.85}
.flist .c{width:20px;height:20px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center}
.flist .done .c{background:var(--chk);border-color:var(--chk)}
.flist button{background:none;border:0;color:#fff;text-align:left;font-size:15px;font-weight:500;padding:0}
.flist .done button{color:var(--flow-dim)}
.flist .lock button{color:#c9d5db;cursor:default}
.obtn{display:block;width:calc(100% - 36px);margin:12px 18px;background:var(--card);border:1.5px solid #707070;border-radius:4px;padding:7px;font-size:16px;font-weight:600}
.h2{font-size:20px;font-weight:700;margin:22px 18px 10px}
.ro{padding:6px 18px}
.ro .l{font-size:14px;color:var(--lab)} .ro .v{font-size:16px;margin-top:1px;overflow-wrap:anywhere}
.avb{margin:10px 16px 0;padding:8px 12px;border-radius:6px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}

function decisionVecino(a,n){
  const P=(n===1?a.cev1:a.cev2).ports,mine=P[a.red.puerto-1],lib=P.filter(x=>x.st==="LIB"&&x.p!==a.red.puerto);
  if(n===2){const loss=(cmpRows(a)||[]).filter(r=>r.loss&&!r.me);
    return `<div class="dec"><b>Acción del técnico (simulador)</b>${loss.length?`<div style="font-size:13px">El cuadro comparativo muestra pérdida ≥1 dB en P${loss.map(r=>r.p).join(", P")}.</div><button type="button" class="pri" data-wact="corregir">Subir a la NAP y corregir</button><button type="button" data-wact="ok2">Continuar sin corregir</button>`:`<button type="button" class="pri" data-wact="ok2">Todo conforme, continuar</button>`}<button type="button" data-a="cevcmp">Ver cuadro comparativo</button></div>`;}
  if(mine.st==="OCU")return `<div class="dec"><b>Acción del técnico (simulador)</b><div style="font-size:13px">Tu puerto P${mine.p} figura OCU (reservado para esta orden). La caja tiene ${P.filter(x=>x.rx!=null).length} puertos con potencia.</div><button type="button" class="pri" data-wact="ok1">NAP con potencia, continuar</button><button type="button" data-wact="tce0">Escalar a TCE</button></div>`;
  if(lib.length)return `<div class="dec"><b>Acción del técnico (simulador)</b><div style="font-size:13px">Tu puerto P${mine.p} está ocupado por otra ONT (${esc(mine.sn)}). Hay ${lib.length} puerto(s) libre(s).</div><button type="button" class="pri" data-wact="cambio">Cambio de puerto a P${lib[0].p}</button><button type="button" data-wact="tce0">Escalar a TCE</button></div>`;
  return `<div class="dec"><b>Acción del técnico (simulador)</b><div style="font-size:13px">No hay puertos libres: NAP saturada.</div><button type="button" class="pri" data-wact="tce1">Escalar a TCE (NAP saturada)</button><button type="button" data-wact="forzar">Conectar sobre un puerto ocupado</button></div>`;
}

  if(hasCas(a,"nap_no_encontrada")&&!a.flags.napFound&&!a.fis.nap)return "nonap";
  if(a.schaman==="NOK"&&a.fis&&(!a.fis.drop||!a.fis.fibra))return "nofis";
  if(a.schaman==="NOK"){if(a.flags.nokPort)return "ocupado_nok";if(hasCas(a,"ont_id_ocupada")&&!a.flags.idLib)return "idocup";if(hasCas(a,"ont_no_registra")&&!a.flags.noregOk)return "noreg";return "nok";}

   ${S.day.pen.length?`<h4 style="margin:12px 0 4px">Penalidades de la jornada</h4><ul>${S.day.pen.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}

  else if(k==="banderin"){f.banderin=1;adv(2);fisLog(a,"Banderín azul colocado en el puerto P"+a.red.puerto+".");}else if(k==="etiqueta"){const M=S.mochila;if((M.etiq??0)<1){S.faltaVisto=1;fisLog(a,"No tienes etiquetas de identificación: pide reposición.");}else{M.etiq--;f.etiq=1;adv(2);fisLog(a,"Etiqueta pegada en la "+a.red.tipo+": "+a.red.cto+" · P"+a.red.puerto+" · OT "+a.ordenTrabajo+" · "+CONTRATAS[1]+" · FTTH · "+FECHA+".");}}else if(k==="limpRos"){if(!S.mochila.herr.oneclick){S.faltaVisto=1;fisLog(a,"No tienes One Click en tu mochila.");}else{adv(3);a.flags.limpRos=1;fisLog(a,"Conectores de roseta, patch cord y ONT limpios con One Click.");}}else if(k==="vfl"){if(S.mochila.herr.vfl===0){S.faltaVisto=1;fisLog(a,"No tienes VFL en tu mochila.");}else{adv(3);a.flags.vflUsed=1;fisLog(a,"Con el VFL ves un punto rojo brillante en el tramo interno, en la esquina del zócalo: la fibra está doblada (macrocurvatura).");}}else if(k==="curva"){adv(8);a.flags.curvaOk=1;a.flags.medRos=0;fisLog(a,"Rehiciste el tramo con curvas amplias y sin tensar. Vuelve a medir la potencia en la roseta.");}
  else if(k==="cerrarCto"){f.cerrada=1;adv(3);S.fview="ext";fisLog(a,"CTO cerrada.");}

  else if(k==="cajaPaso"){f.tend=1;f.loc="puerta";adv(10);fisLog(a,"Fibra en la caja de paso del departamento.");}
  else if(k==="plan"){a.tend=a.tend||{plan:(a.postes||[]).map(()=>({fij:"",ferr:"",lado:""}))};f.planOpen=1;}
  else if(k==="planOk"){const P=a.tend.plan;if(P.some(x=>!x.fij||(x.fij!=="No usar (Claro)"&&(!x.ferr||!x.lado))))return toast("Completa la fijación, ferretería y lado de cada poste.");
    const errs=auditPlan(a);f.plan=1;f.planOpen=0;adv(10*(a.postes||[]).length);

  else if(k==="bolear"){f.bolOpen=1;}
  else if(k==="lanzar"){const ph=((performance.now()-(window._bolT0||0))/900)%2,pos=ph<1?ph:2-ph,z=LV()===1?[.3,.7]:[.4,.6];
    if(pos>z[0]&&pos<z[1]){f.bolOk=1;f.bolOpen=0;adv(3);fisLog(a,"¡Boleo exitoso! La fibra pasó sobre el obstáculo.");const ob=(a.postes||[]).find(x=>x.obst);if(ob&&ob.obst==="cables"&&(a.flags.atsMiss||[]).includes("cables eléctricos"))pen(a,"Boleó cerca de cables eléctricos sin haberlos identificado en el ATS");}
    else{adv(5);fisLog(a,"La fibra se enganchó en el obstáculo. Inténtalo otra vez (+5 min).");}}
  else if(k==="bolX"){f.bolOpen=0;}
  else if(k==="ftramo"){a.ev="ftramo";}
  else if(k==="bajar"){f.tend=1;f.loc="puerta";adv(10);fisLog(a,"Drop bajado hasta la medianera de la casa.");}
  else if(k.indexOf("e_")===0){if(!a.inicio||cl.puerta!==1||cl.ingreso!==1)return toast("Primero el cliente debe abrirte y darte permiso de ingreso.");const t=k.slice(2);S.fview="casa";
    if(t==="art"&&cl.ubic!==1)return toast("Primero acuerda con el cliente dónde va el equipo (panel Cliente).");e[t]=1;adv(3);

    if(t==="art"){if(a.flags.artef){a.flags.artVisto=1;fisLog(a,"Junto al lugar elegido hay "+a.flags.artef+". Explícale al cliente que el router debe quedar libre de artefactos (panel Cliente).");}else fisLog(a,"El lugar elegido está libre de artefactos.");}}
  else if(k==="fibra"){if(!a.inicio||cl.puerta!==1||cl.ingreso!==1)return toast("Primero el cliente debe abrirte y darte permiso de ingreso.");if(cl.ubic!==1)return toast("Primero acuerda con el cliente dónde va el equipo (panel Cliente).");
    if(m.drop<a.metrajeReal||m.ros<1||m.con<1||m.pat<1){S.faltaVisto=1;fisLog(a,"No te alcanza el material: necesitas "+a.metrajeReal+" m de drop, 1 roseta, 1 conector y 1 patch cord. Revisa tu mochila.");return render();}
    if(["rec","rie","duc","acc","art"].some(x=>!e[x])&&!a.flags.evalPen){a.flags.evalPen=1;pen(a,"Pasó la fibra sin completar la evaluación interna");}
    if(hasCas(a,"cable_visible")&&!cl.cv){cl.cv=1;cliSay(a,"cli","¡Le dije que no quería cables a la vista ni perforaciones!");cliSat(a,-20);pen(a,"Perforó sin confirmar con el cliente el acceso y el recorrido");}
    if(LV()===5&&R0.includes("perro")&&!a.flags.perroOk&&!a.flags.perroInc){a.flags.perroInc=1;adv(15);pen(a,"Incidente: el perro interrumpió el trabajo (no se pidió asegurarlo)");}

  else if(k==="medirRos"){adv(2);a.flags.medRos=1;const pc=potCliEff(a),pn=potMed(a);fisLog(a,"Power meter en roseta: "+pc.toFixed(2)+" dBm"+(pn!=null?" (pérdida "+(pn-pc).toFixed(2)+" dB"+((pn-pc)>1.5&&LV()<=2?" · mayor a 1.5 dB: revisa los conectores":"")+")":""));}

  else if(k==="limpieza"){f.limpio=1;adv(5);fisLog(a,"Área de trabajo limpia: sin restos de cable ni polvo.");cliSat(a,2);}
  else if(k==="parquear"){S.estacionado=true;adv(2);fisLog(a,"Te estacionaste para usar el celular.");}

  else if(k==="luces"){lucesJuego(a);return;}
  else if(k==="puertoDrop"){campoAccion(a,"puerto");return;}
  render();}

function evOpts(a){if(!a||!a.ev)return [];const f=a.flags,cl=()=>{a.ev=null;};
  switch(a.ev){
  case "nonap":return [{t:"Escalar a TCE: Formulario TCE (casuística 5, consultas operativas) y chat Help Desk-TCE",fn:()=>{cl();f.nonapEsc=1;fisLog(a,"Vas a escalar la NAP no encontrada a TCE.");}},{t:"Usar la caja más cercana que veo",fn:()=>{cl();pen(a,"Falta grave: instaló en una caja distinta a la asignada");a.fis.nap=1;a.fis.loc="poste";f.napWrong=1;}}];
  case "conserje":return [{t:"Pedir al cliente que baje a autorizar el ingreso",fn:()=>{adv(10);if(Math.random()<.7){cl();f.adminOk=1;a.fis.nap=1;a.fis.loc="poste";fisLog(a,"El cliente bajó y autorizó el ingreso. Ubicaste la NAP del edificio.");}else a.ev="conserje2";}},{t:"Entrar sin permiso",fn:()=>{cl();pen(a,"Ingresó al cuarto de telecomunicaciones sin autorización de la administración");f.adminOk=1;a.fis.nap=1;a.fis.loc="poste";}}];
  case "conserje2":return [{t:"Escalar a TCP (Help Desk-TCP)",fn:()=>{cl();f.accEsc=1;fisLog(a,"Escala a TCP: la administración no da acceso.");}}];
  case "ducto":{const L=[{t:"Intentar pasar la guía (15 min)",fn:()=>{adv(15);f.guiaIntento=1;if(Math.random()<.5){cl();f.ductoOk=1;fisLog(a,"La guía pasó: liberaste el ducto.");if(a.red.tipo==="NAP"&&!a.fis.guia)a.fis.guia=1;else completarFibra(a);}else fisLog(a,"La guía no pasa: el ducto sigue obstruido.");}}];
    if(f.guiaIntento)L.push({t:"Ofrecer canaleta por la pared",fn:()=>{cliSay(a,"et","El ducto está obstruido. Le propongo llevar la fibra en canaleta por la pared, bien ordenada.");if(Math.random()<(a.cliTipo==="exigente"?.3:.6)){cliSay(a,"cli","Está bien, con canaleta.");cl();f.ductoOk=1;S.mochila.canaleta=Math.max(0,S.mochila.canaleta-6);completarFibra(a);}else{cliSay(a,"cli","No, canaleta no quiero.");a.ev="ducto2";}}});
    L.push({t:"Dar fallida e irme",fn:()=>{cl();if(!f.guiaIntento)pen(a,"Falta grave: se fue sin intentar pasar la guía por el ducto obstruido");fisLog(a,"Decidiste dar fallida.");}});return L;}
  case "ducto2":return [{t:"Escalar al Supervisor ET (WhatsApp)",fn:()=>{cl();f.ductoEsc=1;fisLog(a,"Escribe a tu Supervisor ET por WhatsApp.");}}];
  case "dano":return [{t:"Avisar de inmediato al cliente y al Supervisor ET",fn:()=>{cl();f.danoRep=1;cliSay(a,"et","Disculpe, señora: al perforar toqué una tubería. Ya cerré la llave y aviso a mi supervisor para solucionarlo.");cliSat(a,-10);cliSay(a,"cli","¡Ay, no! Bueno, gracias por decirme.");pen(a,"Daño al perforar por no preguntar por tuberías (reportado)");supSay("Gracias por avisar. Coordina con el cliente y registra «Hubo daño» al finalizar la actividad.");completarFibra(a);}},{t:"Seguir trabajando sin decir nada",fn:()=>{cl();f.danoOculto=1;completarFibra(a);}}];
  case "ftramo":return [{t:"Falso medio tramo: el drop no se corta; cambia de dirección frente a la medianera, con 2 templadores, tramo auxiliar al poste siguiente y amarre trenzado",fn:()=>{cl();if((S.mochila.templ??0)<2){S.faltaVisto=1;fisLog(a,"No tienes 2 templadores en la mochila.");return;}S.mochila.templ-=2;a.fis.ftramo=1;a.flags.ftOk=1;a.flags.tramoAux=rnd(6,12);adv(15);fisLog(a,"Falso medio tramo armado (2 templadores, "+a.flags.tramoAux+" m de tramo auxiliar).");}},
    {t:"Cortar el drop y amarrarlo frente a la medianera",fn:()=>{cl();a.fis.ftramo=1;pen(a,"Auditoría de tendido: cortó el drop en lugar de usar falso medio tramo");}},
    {t:"Entrar por la esquina de la casa, sin falso tramo",fn:()=>{cl();a.fis.ftramo=1;pen(a,"Auditoría de tendido: ingresó por la esquina sin falso medio tramo (estética)");}}];
  case "camioneta":return [{t:"Entendido",fn:cl}];
  case "averiada":return [{t:"Escalar a TCE: Formulario TCE (casuística 4, coordinación con áreas externas) y chat Help Desk-TCE",fn:()=>{cl();fisLog(a,"Vas a escalar la CTO averiada a TCE.");}},{t:"Conectar igual en la caja dañada",fn:()=>{cl();pen(a,"Falta grave: conectó en una CTO averiada sin escalar");a.flags.avForz=1;}}];
  case "insegura":return [{t:"Avisar al Supervisor ET (WhatsApp)",fn:()=>{cl();f.insEsc=1;fisLog(a,"Escribe a tu Supervisor ET por WhatsApp antes de continuar.");}},{t:"Seguir sin avisar",fn:()=>{cl();if(Math.random()<.4){S.mochila.herr.powermeter=0;pen(a,"Robo de herramienta (power meter) por no reportar la zona insegura");fisLog(a,"Te robaron el power meter de la camioneta.");}}}];
  case "trafico":return [{t:"Entendido",fn:cl}];}
  return [];}

/* --- Procesos con espera real: Validar inventario ~3 min, Activar y Certificación 3–5 min.

const PROC_K=["valinv","activar","cert"];
const PROC_MIN={valinv:[2,4],activar:[3,5],cert:[3,5]};
const PROC_TXT={valinv:"Validar inventario",activar:"Activación",cert:"Certificación"};

function procStart(a,k,res){a.proc=a.proc||{};a.chk=a.chk||{};const [lo,hi]=PROC_MIN[k],d=rnd(lo,hi);
  a.chk[k]=hhmm(S.clock);a.proc[k]=Object.assign({st:"proc",due:S.clock+d,seen:false},res);
  hist(a,STEP[k]+" enviado · respuesta en ~"+d+" min");laterK(d,"procFin",a.id,{k});}
const PROC_FIN={
  valinv(a,p){a.flags.vinv={cant:p.cant,comp:p.comp};
    if(p.low){hist(a,"Validación de inventario: NOK (serie en minúscula)","bad");if(!a.flags.lowPen){a.flags.lowPen=1;pen(a,"Validó una ONT con la serie en minúscula");}return;}
    if(p.ok){markDone(a,"valinv",0);hist(a,"Validación de inventario: SOK","ok");return;}
    if(!a.flags.vinvPen){a.flags.vinvPen=1;pen(a,!p.cant?"Validación de inventario NOK: falta el router WiFi requerido":"Validación de inventario NOK: la serie registrada no coincide con el equipo instalado");}
    hist(a,"Validación de inventario: NOK","bad");},
  activar(a,p){a.flags.nokPort=p.ocupado;a.flags.nokMsg=p.nokMsg;a.schamanHora=hhmm(S.clock);
    if(p.ok){a.schaman="SOK";markDone(a,"activar",0);hist(a,"Schaman: SOK","ok");}
    else{a.schaman="NOK";hist(a,"Schaman: NOK"+(p.nokMsg?" · "+p.nokMsg:""),"bad");}},
  cert(a,p){if(p.ok){markDone(a,"cert",0);hist(a,"Certificación: OK","ok");}else hist(a,"Certificación: NOK · "+p.msg,"bad");}
};
TQH.procFin=function(a,d){if(!a)return;const p=procOf(a,d.k);if(!p||p.st!=="proc")return;PROC_FIN[d.k](a,p);p.st=p.ok?"SOK":"NOK";p.at=S.clock;
  notifySys("Respuesta de "+PROC_TXT[d.k]+" disponible · revisa Cumplimiento (OT "+a.ordenTrabajo+")",a.id,"proc");S._dirty=1;};
/* Esperas de respuesta del sistema o de las áreas (TCE, TCP): el botón «Esperar respuesta» adelanta el reloj */
const RESP_N=["procFin","tceRecibe","tceResolver","tceLateResp","caRecibe","validarCA","caLateResp","chatApoyo","escAtendido","ausReactivar"];
function respDue(a){const q=tqL().filter(t=>t.id===a.id&&RESP_N.includes(t.name));return q.length?Math.min(...q.map(t=>t.due)):null;}

  if(pend.length){const due=Math.min(...pend.map(k=>a.proc[k].due));h+=`<div class="avb warn"><span>⏳ ${pend.map(k=>PROC_TXT[k]).join(" y ")} en proceso · respuesta ~${hhmm(due)}. Mientras tanto avanza otras tareas.</span><button type="button" data-a="esperar">Esperar respuesta</button></div>`;}

function cumpl(a){const pv=procOf(a,"valinv"),pa=procOf(a,"activar"),pc=procOf(a,"cert");
  PROC_K.forEach(k=>{const p=procOf(a,k);if(p&&p.st!=="proc")p.seen=true;});

  return `${ro("ID de actividad",a.id)}${ro("Orden de trabajo",a.ordenTrabajo)}
  <div class="h2">Activación</div>${ro("Código activación",ap?"En proceso":a.schaman==="Sin enviar"?"":a.schaman)}${ro("Resultado activación",ap?"Activación enviada, esperando respuesta.":a.schaman==="SOK"?"La activación del bundle "+a.servicio.producto+" se completó exitosamente":a.schaman==="NOK"?(a.flags.nokMsg||"Error en la activación del equipo"):"")}${ro("Timestamp de activación",a.schamanHora&&!ap?"2026-10-23 "+a.schamanHora:"")}
  <div class="h2">Certificación</div>${ro("Código Certificación",cCod)}${ro("Mensaje certificación",cMsg)}
  <div class="h2">Validación de Inventario</div>${vin||ro("Estado validación compatibilidad","")}
  <div class="h2">Cambio de recurso</div>${ro("Id proyecto inventario shm","80876")}`;}

 [/No realizado|suspensi|Suspender/i,"Motivo de No realizado / suspensión"],[/TCE/,"Escalamiento a TCE"],[/TCP/,"Coordinación con TCP"],

 [/wifi|router|bandas|repetidor/i,"WiFi y router"],[/acta|Finalizar|Finalizó|Certificación|Cierre|DNI/i,"Acta y cierre"],

 [/WiNET|vecino|puerto|Cambio Caja|Asignación|CTO|NAP|caja|potencia|Conectó/i,"Red: NAP, CTO y WiNET"]];
function gsCat(t){for(const [re,c] of GS_CATS)if(re.test(t))return c;return "Otros";}
/* registro de intentos (una orden cerrada por partida) */
function gsPend(){try{return JSON.parse(localStorage.getItem("gsfsc-pend")||"[]");}catch(e){return [];}}
function gsPendSet(a){try{localStorage.setItem("gsfsc-pend",JSON.stringify(a.slice(-20)));}catch(e){}}
function gsFlush(){if(GS.flushing||!GS.id)return;const q=gsPend();if(!q.length)return;GS.flushing=1;
  const one=()=>{const it=gsPend()[0];if(!it){GS.flushing=0;return;}
    gsApi("/intento",it).then(r=>{gsPendSet(gsPend().slice(1));if(r&&r.valido&&it.dni===GS.id.dni){GS.lv=Math.max(GS.lv,it.nivel);GS.id.lv=GS.lv;gsSave();}
      try{toast(r&&r.valido?"Tu tiempo cuenta para el ranking: "+gsFmt(it.segundos):"Tu tiempo no cuenta: más de "+(r&&r.limite)+" penalidades.");}catch(e){}one();})
     .catch(er=>{if(/autorizado|inválido/i.test(er.message))gsPendSet(gsPend().slice(1));GS.flushing=0;});};
  one();}
function gsNivel(){try{if(!GS.id||!S||!S.acts)return;
  if(!S.gsDone&&S.selOk){const a=S.acts.find(x=>x.estado==="completada");
    if(a){S.gsDone=1;const pens=(a.penalidades||[]).concat((S.day&&S.day.pen)||[]).map(t=>({cat:gsCat(t),txt:String(t).slice(0,200)}));
      const q=gsPend();q.push({dni:GS.id.dni,nivel:S.level||1,casuistica:String(S.practica||a.casuistica||"normal"),segundos:Math.max(30,Math.round(S.gsSeg||0)),puntaje:a.cli&&a.cli.sat!=null?Math.round(a.cli.sat):null,ayudas:(S.day&&S.day.ayudas)||0,penalidades:pens});gsPendSet(q);}}
  gsFlush();}catch(e){}}
/* ranking: podio general y un podio por nivel */
const gsCopaN=(c,s)=>gsCopa(c).replace('width="54" height="54"','width="'+s+'" height="'+s+'"');
function gsPodio(lst,small,sub){const t=lst.slice(0,3),cols=[[t[1],"#C9D1DA",2],[t[0],"#FFC83D",1],[t[2],"#CD7F32",3]];
  return `<div class="gspod ${small?"sm":""}">${cols.map(([x,c,n])=>`<div class="gsp p${n}">${gsCopaN(c,small?38:54)}<b>${x?esc(x.nombre):"—"}</b><small>${x?(sub?sub(x):gsFmt(x.segundos)):"libre"}</small><i>${n}</i></div>`).join("")}</div>`;}
function gsRankHtml(){const r=GS.data.rank;let h=`<p class="gsm">Ranking por <b>tiempo real</b> de juego. Cuenta solo si la orden cerró con pocas penalidades.</p>`;
  if(GS.id)h+=`<p class="gsm">Tus niveles superados: <b>${GS.lv}/5</b></p>`;
  if(r===null)h+=`<p class="gsm">Cargando…</p>`;
  else if(!r.niveles){h+=`<p class="gsm">Ranking no disponible.</p>`;}
  else{h+=`<h3 class="gsh3">🏆 General</h3>`+gsPodio(r.general||[],false,x=>x.niveles+" niv · "+gsFmt(x.segundos));
    if((r.general||[]).length>3)h+=`<div class="gsr">${r.general.slice(3,10).map((x,i)=>`<div class="gsrow ${GS.id&&x.nombre===GS.id.nombre?"me":""}"><span class="gsn">${i+4}</span><div><b>${esc(x.nombre)}</b><small>${x.niveles} niveles · ${gsFmt(x.segundos)}</small></div></div>`).join("")}</div>`;
    r.niveles.forEach(n=>{h+=`<h3 class="gsh3">Nivel ${n.nivel} · ${esc(NIV[n.nivel-1]||"")}</h3>`+gsPodio(n.top||[],true);});}
  if(GS.msg)h+=`<p class="gser">${esc(GS.msg)}</p>`;return gsWrap("Ranking de tiempos",h);}

    const L=hz.filter(x=>!GS.flt||x.estado===GS.flt);
    h+=L.length?L.map(x=>`<div class="gsca"><div class="gscah"><span class="gse ${gsEst[x.estado]||""}">${esc(x.estado)}</span><b>${esc(x.nombre||x.dni)}</b></div><small>${esc(gsTipo(x.tipo))} · ${esc(x.pantalla||"")}${x.orden?" · OT "+esc(x.orden):""}</small><p>${esc(x.descripcion)}</p>${x.mostrar_como?`<small>Créditos como: ${esc(x.mostrar_como)}</small>`:""}<input data-gsn="${x.id}" maxlength="200" placeholder="Nota del PO (opcional)" value="${esc(x.nota_po||"")}"><div class="gsac"><button type="button" data-gs="poest" data-id="${x.id}" data-v="Validada">Validar</button><button type="button" data-gs="poest" data-id="${x.id}" data-v="Implementada">Implementada</button><button type="button" data-gs="poest" data-id="${x.id}" data-v="Descartada">Descartar</button></div></div>`).join(""):`<p class="gsm">Sin hazañas en este filtro.</p>`;}

},true);
